<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2D Delta · 美术资产</title>
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="style.css">
  <style>
    html { height:auto; min-height:100%; overflow:auto }
    body { height:auto; overflow:visible; min-height:100vh; background:#101710 }
    main { max-width:1180px; padding:44px 24px 64px; margin:auto }
    header { display:flex; justify-content:space-between; align-items:center; gap:24px; border-bottom:1px solid #405039; padding-bottom:22px }
    h1 { margin:0 0 8px; font:700 28px var(--font-display) }
    p { color:#a4b29b; font-size:13px; line-height:1.8 }
    a { color:#c9f568; white-space:nowrap }
    h2 { margin:36px 0 14px; font-size:17px; color:#d4dfc9 }
    .asset-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px }
    .specimen { margin:0; padding:14px 8px; text-align:center; border:1px solid #38462f; background:#1b251a }
    .specimen .asset-icon { width:112px; height:112px }
    .specimen .asset-weapons { width:128px; height:64px; margin:24px 0 }
    .specimen .asset-tag { font-size:10px }
    figcaption { font-size:12px; margin-top:10px; color:#d0dcc4 }
    figcaption small { display:block; color:#869a75; font:9px var(--font-mono); margin-top:6px }
    #asset-status { color:#c9f568; min-height:24px }
    @media(max-width:500px) { header {align-items:flex-start;flex-direction:column;gap:8px} }
  </style>
</head>
<body>
  <main>
    <header><div><h1>2D Delta · 美术资产</h1><p>角色、装备、战利品与场景全部使用图像。新增四级护甲维修包及二十种战利品。</p></div><a href="./">返回游戏</a></header>
    <p id="asset-status" role="status">正在加载透明 PNG 图集…</p>
    <div id="collections"></div>
    <p>图像临时不可用时显示中性线框轮廓。图像 ID 与旧存档兼容；物品占格尺寸由配置决定，图像比例始终保持。</p>
  </main>
  <script type="module">
    import { allAssets, assetMarkup, loadGameAssets, atlasDefinitions } from './js/assets.js';
    import { allItems, loadLootData } from './js/lootdata.js';
    const titles = { operators:'特工', enemies:'敌人', weapons:'枪械', equipment:'装备与搜索容器', inventory:'补给、维修与物资', valuables:'电子、工业与高价值战利品', world:'场景与撤离点' };
    await loadLootData();
    const defs = new Map(allItems().map(item => [item.id,item]));
    const collections = document.getElementById('collections');
    for (const [sheet, title] of Object.entries(titles)) {
      const assets = allAssets().filter(asset => asset.sheet === sheet);
      const section = document.createElement('section');
      const heading = document.createElement('h2'); heading.textContent = title + ' / ' + assets.length;
      const grid = document.createElement('div'); grid.className = 'asset-grid';
      for (const asset of assets) {
        const def = defs.get(asset.key);
        const figure = document.createElement('figure'); figure.className = 'specimen';
        figure.innerHTML = assetMarkup(asset.key);
        const caption = document.createElement('figcaption'); caption.textContent = asset.label;
        const metadata = document.createElement('small');
        metadata.textContent = def ? `${def.gridW} × ${def.gridH} 格 / 稀有度 ${def.rarity}` : asset.key;
        caption.appendChild(metadata); figure.appendChild(caption); grid.appendChild(figure);
      }
      section.append(heading,grid); collections.appendChild(section);
    }
    const loaded = await loadGameAssets(), count = loaded.filter(sheet => sheet.ready).length, total = Object.keys(atlasDefinitions).length;
    document.getElementById('asset-status').textContent = count === total
      ? `${allAssets().length} 项资产已加载 / ${total} 张透明 PNG 图集`
      : `${count}/${total} 张图集已加载；未加载的图集显示线框轮廓。`;
  </script>
</body>
</html>
