name: Project checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  single-player:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mvp-verification
          path: |
            docs/mvp/browser-results.json
            docs/mvp/game-results.json
            docs/mvp/screenshots/
